# Lancement avec Docker sur un ordinateur ou un serveur SANS Coolify.
# (Sur Coolify, utilisez le build pack « Dockerfile » : ce fichier n'est pas nécessaire.)
#
#   ACCUEIL_PASSWORD='un-mot-de-passe-fort' BOUTIQUE_PASSWORD='un-autre-mot-de-passe' docker compose up -d --build
#   → écran : http://localhost:3000/ecran   accueil : http://localhost:3000/accueil
#     boutique (remise des cartes promo) : http://localhost:3000/boutique
#
# Arrêt : docker compose down   (les données restent dans le volume « lobby-data »)

services:
  lobby:
    build: .
    image: lobby-riftbound:local
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      ACCUEIL_PASSWORD: ${ACCUEIL_PASSWORD:?Définissez ACCUEIL_PASSWORD (mot de passe de l'accueil)}
      # Facultatif : mot de passe de la boutique (page /boutique seulement : recherche et remise des
      # cartes promo, ni accueil ni export CSV). Il doit être différent de ACCUEIL_PASSWORD. Sans lui,
      # seul le mot de passe de l'accueil ouvre /boutique.
      BOUTIQUE_PASSWORD: ${BOUTIQUE_PASSWORD:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      # Proxys dont on croit X-Forwarded-For / X-Forwarded-Proto (IP du visiteur, HTTPS).
      # « false » : ce fichier publie le port 3000, joint directement sans proxy, donc
      # personne n'est cru. Proxy HTTPS (Caddy, nginx…) placé devant, sur cette machine
      # ou sur un réseau privé : TRUST_PROXY='loopback, linklocal, uniquelocal' (valeur par
      # défaut de l'application, celle utilisée sur Coolify). Autres valeurs : README.md.
      TRUST_PROXY: ${TRUST_PROXY:-false}
    volumes:
      - lobby-data:/data
    stop_grace_period: 15s

volumes:
  lobby-data:
