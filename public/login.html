<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Connexion – Accueil Riftbound Radiance</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/shared/theme.css">
  <style>
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background:
        radial-gradient(900px 520px at 50% -10%, rgba(31, 95, 214, 0.35), transparent 65%),
        radial-gradient(700px 420px at 50% 115%, rgba(242, 193, 78, 0.12), transparent 60%),
        var(--rb-night);
    }

    .login-card {
      width: min(420px, 100%);
      padding: 30px 28px 26px;
      border-radius: var(--rb-radius);
      background: rgba(15, 29, 69, 0.92);
      border: 1px solid rgba(242, 193, 78, 0.4);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.55), var(--rb-glow-blue);
    }

    .kicker {
      margin: 0;
      font-family: var(--rb-font-condensed);
      font-weight: 600;
      font-size: 0.85rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--rb-cyan);
      text-align: center;
    }

    h1 {
      margin: 6px 0 4px;
      font-family: var(--rb-font-display);
      font-weight: 700;
      font-size: 1.7rem;
      letter-spacing: 0.04em;
      text-align: center;
      color: var(--rb-gold);
      text-shadow: 0 0 22px rgba(242, 193, 78, 0.4);
    }

    .sub {
      margin: 0 0 22px;
      text-align: center;
      color: var(--rb-muted);
      font-size: 0.98rem;
    }

    .divider {
      height: 1px;
      margin: 0 0 22px;
      background: linear-gradient(90deg, transparent, rgba(242, 193, 78, 0.6), transparent);
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-family: var(--rb-font-condensed);
      font-weight: 600;
      font-size: 0.95rem;
      letter-spacing: 0.04em;
      color: var(--rb-muted);
    }

    .password-row {
      display: flex;
      gap: 8px;
    }

    input[type='password'],
    input[type='text'] {
      flex: 1 1 auto;
      min-width: 0;
      min-height: 50px;
      padding: 0 14px;
      border: 1px solid rgba(140, 180, 255, 0.3);
      border-radius: var(--rb-radius-sm);
      background: #08122e;
      color: var(--rb-text);
      font-family: var(--rb-font-body);
      font-size: 1.15rem;
    }

    input:focus {
      outline: none;
      border-color: var(--rb-azure);
      box-shadow: 0 0 0 3px rgba(63, 169, 255, 0.5);
    }

    input[aria-invalid='true'] {
      border-color: var(--rb-danger);
    }

    button {
      font-family: var(--rb-font-condensed);
      font-weight: 700;
      cursor: pointer;
      border-radius: var(--rb-radius-sm);
    }

    button:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px rgba(63, 169, 255, 0.6);
    }

    .toggle-visibility {
      flex: none;
      min-width: 92px;
      border: 1px solid var(--rb-line);
      background: rgba(20, 39, 87, 0.7);
      color: var(--rb-text);
      font-size: 1rem;
    }

    .submit {
      width: 100%;
      min-height: 54px;
      margin-top: 18px;
      border: 1px solid #ffe7a3;
      background: linear-gradient(180deg, #ffd977 0%, var(--rb-gold) 55%, #d9a43a 100%);
      color: #1a1203;
      font-size: 1.25rem;
      letter-spacing: 0.03em;
      box-shadow: 0 2px 16px rgba(242, 193, 78, 0.3);
    }

    .submit:hover,
    .toggle-visibility:hover {
      filter: brightness(1.1);
    }

    .error {
      margin: 0 0 16px;
      padding: 10px 12px;
      border-radius: var(--rb-radius-sm);
      background: rgba(255, 93, 108, 0.14);
      border: 1px solid rgba(255, 93, 108, 0.6);
      color: #ffd0d5;
      font-weight: 600;
    }

    .foot {
      margin: 18px 0 0;
      text-align: center;
      font-size: 0.9rem;
      color: var(--rb-faint);
    }

    .foot a {
      color: var(--rb-cyan);
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>
<body>
  <main class="login-card">
    <p class="kicker">Paris Games Week</p>
    <h1>Riftbound Radiance</h1>
    <p class="sub">Accès à l'interface d'accueil</p>
    <div class="divider" aria-hidden="true"></div>

    <p class="error" id="error-wrong" role="alert" hidden>Mot de passe incorrect.</p>
    <p class="error" id="error-limit" role="alert" hidden>Trop de tentatives, réessayez dans quelques minutes.</p>

    <form method="post" action="/login" autocomplete="off">
      <label for="password">Mot de passe</label>
      <div class="password-row">
        <input type="password" id="password" name="password" required autofocus autocomplete="current-password" spellcheck="false">
        <button type="button" class="toggle-visibility" id="toggle-visibility" aria-controls="password" aria-pressed="false">Afficher</button>
      </div>
      <button type="submit" class="submit">Se connecter</button>
    </form>

    <p class="foot">Écran public des tables : <a href="/ecran">/ecran</a></p>
  </main>

  <script>
    (function () {
      'use strict';
      var error = new URLSearchParams(window.location.search).get('error');
      var input = document.getElementById('password');
      var shown = null;
      if (error === 'trop') shown = document.getElementById('error-limit');
      else if (error) shown = document.getElementById('error-wrong');
      if (shown) {
        shown.hidden = false;
        input.setAttribute('aria-invalid', 'true');
        input.setAttribute('aria-describedby', shown.id);
      }
      var toggle = document.getElementById('toggle-visibility');
      toggle.addEventListener('click', function () {
        var reveal = input.type === 'password';
        input.type = reveal ? 'text' : 'password';
        toggle.textContent = reveal ? 'Masquer' : 'Afficher';
        toggle.setAttribute('aria-pressed', String(reveal));
        input.focus();
      });
      input.focus();
    })();
  </script>
</body>
</html>
